name: nova
description: "Nova — personal on-device AI companion. Android background service, no UI screens."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State + DI. Matches the existing GetX/Hive stack.
  get: ^4.7.2

  # Local storage for notes, config, the WhatsApp allow-list.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Runtime permission flow (mic, overlay, notifications).
  permission_handler: ^11.3.1

  # Model/asset paths on device.
  path_provider: ^2.1.5
  path: ^1.9.0

  # Phase 1 starter skill — battery status, end to end.
  battery_plus: ^6.2.1

  # Voice I/O:
  #  - flutter_tts    -> Android's TextToSpeech engine (audio out)
  #  - speech_to_text -> Android's SpeechRecognizer (wake phrase + commands).
  #    Uses on-device recognition automatically on phones with the offline
  #    language pack installed, else falls back to Google's recognizer.
  #    Swapped in after vosk_flutter_2 (JNA-based) proved unstable — crashed
  #    natively on-device even after packaging/permission fixes. speech_to_text
  #    is a plain platform-channel wrapper around a system API, not an FFI/JNI
  #    plugin, so it doesn't carry that class of bug.
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # Continuous, always-free wake-word spotting for "Tony" that never touches
  # audio focus — it decodes raw mic samples directly (via `record`'s PCM
  # stream) rather than opening an Android "recognition session", so it
  # doesn't duck/pause other apps' audio while it waits. A tiny (~5MB)
  # bundled int8 model does the spotting; speech_to_text still captures the
  # command afterward. Graceful no-op fallback to speech_to_text-only if init
  # fails for any reason — see sherpa_wake_engine.dart.
  sherpa_onnx: ^1.13.7
  record: ^7.1.1

  # On-device LLM — llama.cpp (FFI, runs in an isolate) with
  # Qwen2.5-3B-Instruct GGUF Q4_K_M. ~1.9GB model, downloaded on first run
  # (see model_downloader.dart).
  llama_sdk: ^0.0.5

  # Streamed model download with progress.
  dio: ^5.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Optional custom status icon. If this file is absent at build time Nova
    # falls back to a generated colored dot — see status_controller.dart.
    - assets/icon/
    # Bundled "Tony" keyword-spotting model (~5MB) — see sherpa_wake_engine.dart.
    - assets/sherpa_kws/
